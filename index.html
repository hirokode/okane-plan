<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お金計画">
<title>お金計画</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ===== テーマ（色はすべてここで定義） ===== */
:root {
  color-scheme: light;
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #f0efeb;
  --border: #e2e0da;
  --text: #1b1b1a;
  --text-2: #52514e;
  --text-3: #7a7973;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --danger: #c62f2f;
  --danger-bg: #fdecec;
  --danger-border: #f3c4c4;
  --ok: #0f7a2e;
  --ok-bg: #e9f6ec;
  --series-fixed: #2a78d6;
  --series-variable: #eb6834;
  --series-savings: #1baf7a;
  --series-reserve: #cfcdc6;
  --switch-off: #cfcdc6;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --sign-ink: #ffffff;
  --tone-in: #a86b00;
  --tone-out: #c62f2f;
  --tone-save: #13875e;
  --tone-chart: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #161615;
    --surface: #1f1f1e;
    --surface-2: #2a2a28;
    --border: #363633;
    --text: #f3f2ee;
    --text-2: #c3c2b7;
    --text-3: #93928a;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --danger: #f07171;
    --danger-bg: #3a1f1f;
    --danger-border: #5c2c2c;
    --ok: #5cc978;
    --ok-bg: #1b2e20;
    --series-fixed: #3987e5;
    --series-variable: #d95926;
    --series-savings: #199e70;
    --series-reserve: #4a4a46;
    --switch-off: #4a4a46;
    --shadow: none;
    --sign-ink: #161615;
    --tone-in: #e3a93b;
    --tone-out: #f07171;
    --tone-save: #3cc48f;
    --tone-chart: #5b9cf0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161615;
  --surface: #1f1f1e;
  --surface-2: #2a2a28;
  --border: #363633;
  --text: #f3f2ee;
  --text-2: #c3c2b7;
  --text-3: #93928a;
  --accent: #3987e5;
  --accent-ink: #ffffff;
  --danger: #f07171;
  --danger-bg: #3a1f1f;
  --danger-border: #5c2c2c;
  --ok: #5cc978;
  --ok-bg: #1b2e20;
  --series-fixed: #3987e5;
  --series-variable: #d95926;
  --series-savings: #199e70;
  --series-reserve: #4a4a46;
  --switch-off: #4a4a46;
  --shadow: none;
  --sign-ink: #161615;
  --tone-in: #e3a93b;
  --tone-out: #f07171;
  --tone-save: #3cc48f;
  --tone-chart: #5b9cf0;
}

/* ===== ベース ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
/* iOS の自動拡大を防ぐため、入力欄は必ず 16px 以上 */
input, select, textarea, button { font: inherit; font-size: 16px; color: inherit; }
input, select, textarea {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
select { appearance: none; -webkit-appearance: none; padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
  background-size: 5px 5px; background-repeat: no-repeat; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.muted { color: var(--text-3); }
h1, h2, h3 { margin: 0; line-height: 1.3; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font-weight: 600; text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: var(--danger-border); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.icon-btn {
  flex: none; width: 40px; height: 40px; min-height: 40px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--text-3);
  font-size: 20px; line-height: 1;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: .3; cursor: default; }

/* ===== レイアウト ===== */
.app { max-width: 720px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.topbar .brand { font-weight: 700; font-size: 16px; white-space: nowrap; margin-right: auto; }
.topbar select { width: auto; max-width: 11em; font-weight: 600; }
.view { padding-top: 16px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text-2); letter-spacing: .04em; margin: 24px 4px 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav .inner { display: flex; width: 100%; max-width: 720px; }
.bottomnav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 10px; text-decoration: none; color: var(--text-3); font-size: 12px; font-weight: 600;
}
.bottomnav a svg { width: 24px; height: 24px; }
.bottomnav a[aria-current="page"] { color: var(--accent); }

/* ===== ホーム ===== */
.hero-label { font-size: 13px; color: var(--text-2); font-weight: 600; }
.hero-value { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0 6px; }
.hero.is-negative .hero-value { color: var(--danger); }
.status {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5;
}
.status .ico { flex: none; font-size: 18px; line-height: 1.2; }
.status.bad { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
.status.bad strong { color: var(--danger); }
.status.good { background: var(--ok-bg); color: var(--ok); }
.status .btn { margin-top: 8px; }
.swatch { flex: none; width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ＋ 入るお金 / − 出ていくお金 / 貯める / グラフ のグループ（グループごとに全体を色付け） */
.equation { font-size: 13px; color: var(--text-2); margin: -2px 0 12px; line-height: 1.6; }
.equation b { font-weight: 700; }
.equation .in { color: var(--tone-in); }
.equation .out { color: var(--tone-out); }
.equation .save { color: var(--tone-save); }
.grp { --tone: var(--tone-chart); margin-top: 22px; }
.grp.tone-in { --tone: var(--tone-in); }
.grp.tone-out { --tone: var(--tone-out); }
.grp.tone-save { --tone: var(--tone-save); }
.grp { --div: color-mix(in srgb, var(--tone) 22%, var(--border)); }
.grp-head { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-size: 15px; font-weight: 750; color: var(--tone); }
.grp-total { margin-left: auto; font-size: 16px; }
.sign { flex: none; width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; line-height: 1; color: var(--sign-ink); background: var(--tone); }
.sign svg { width: 15px; height: 15px; }
.grp-card { background: color-mix(in srgb, var(--tone) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone) 30%, var(--border)); border-radius: 14px; overflow: hidden; }
.grp-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--div); font-size: 13px; color: var(--text-2); }
.grp-foot b { font-size: 16px; color: var(--text); }

.xrow + .xrow { border-top: 1px solid var(--div); }
.xhead { display: flex; align-items: stretch; }
.xtoggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 10px 4px 10px 16px; border: 0; background: transparent; color: inherit; text-align: left; font: inherit; }
.xtoggle .l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.xtoggle .t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 370px) { .xtoggle { gap: 8px; padding-left: 12px; } .xtoggle .v { font-size: 16px; } .edit-btn, .edit-ico { width: 44px; } .srow { padding-left: 30px; } .srow .sv { margin-right: 22px; } }
.xtoggle .s { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xtoggle .v { font-size: 18px; font-weight: 750; white-space: nowrap; }
.caret { flex: none; width: 22px; height: 22px; color: var(--text-3); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.xrow.open .caret { transform: rotate(180deg); }
.edit-btn { flex: none; width: 50px; display: flex; align-items: center; justify-content: center; color: var(--tone); text-decoration: none; }
.edit-btn svg, .edit-ico svg { width: 18px; height: 18px; }
.xbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s cubic-bezier(.2, .8, .2, 1); }
.xrow.open .xbody { grid-template-rows: 1fr; }
.xinner { min-height: 0; overflow: hidden; }
.srow { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 9px 0 9px 36px; border-top: 1px dashed var(--div); color: inherit; text-decoration: none; background: color-mix(in srgb, var(--surface) 50%, transparent); }
.srow .sl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.srow .st { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .ss { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbar { display: block; height: 4px; margin-top: 5px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--tone) 12%, transparent); }
.sbar i { display: block; height: 100%; border-radius: 2px; }
.srow .sv { margin-right: 26px; font-size: 15px; font-weight: 650; white-space: nowrap; }
.edit-ico { flex: none; width: 50px; display: flex; justify-content: center; color: var(--tone); }
.srow.is-off .st, .srow.is-off .sv { color: var(--text-3); }
.srow.is-off .sv { text-decoration: line-through; }
.off-tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 99px; background: var(--surface-2); color: var(--text-3); font-size: 11px; font-weight: 600; vertical-align: 1px; }
.add-link { flex: none; width: 90px; text-align: center; color: var(--tone); font-size: 14px; font-weight: 700; }
.xtoggle:active, .srow:active, .edit-btn:active, .hbar:active, .mcol:active { background: color-mix(in srgb, var(--tone) 10%, transparent); }
@media (hover: hover) { .xtoggle:hover, .srow:hover, .edit-btn:hover, .hbar:hover { background: color-mix(in srgb, var(--tone) 7%, transparent); } }

/* グラフ */
.chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 14px; font-weight: 700; }
.chart-title .muted { font-size: 13px; font-weight: 500; }
.chart-note { margin: 8px 0 0; font-size: 12px; color: var(--text-3); }
.hbar { display: block; padding: 9px 0; border-top: 1px solid var(--border); color: inherit; text-decoration: none; }
.hbar:first-child { border-top: 0; }
.hb-top { display: flex; align-items: baseline; gap: 8px; }
.hb-name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-val { font-weight: 700; white-space: nowrap; }
.hb-pct { width: 3.6em; text-align: right; font-size: 13px; color: var(--text-3); }
.hb-track { display: block; height: 8px; margin-top: 6px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.hb-track i { display: block; height: 100%; border-radius: 4px; background: var(--series-variable); }
.trend-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; font-size: 12px; color: var(--text-2); }
.trend-legend span { display: inline-flex; align-items: center; gap: 5px; }
.line-swatch { display: inline-block; width: 14px; height: 2px; border-radius: 1px; background: var(--text); }
.trend { display: flex; justify-content: space-around; gap: 4px; }
.mcol { flex: 1; min-width: 0; max-width: 72px; display: flex; flex-direction: column; gap: 3px; padding: 6px 0 4px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; }
.mcol.cur { background: var(--surface-2); }
.mplot { position: relative; display: block; }
.mstack { position: absolute; left: 24%; right: 24%; bottom: 0; display: flex; flex-direction: column-reverse; gap: 2px; }
.mstack i { display: block; width: 100%; }
.mstack i:last-child { border-radius: 4px 4px 0 0; }
.mincome { position: absolute; left: 8%; right: 8%; height: 2px; margin-bottom: -1px; border-radius: 1px; background: var(--text); }
.mlabel { font-size: 12px; font-weight: 700; text-align: center; }
.mres { font-size: 11px; text-align: center; color: var(--text-2); white-space: nowrap; }
.mres.neg { color: var(--danger); font-weight: 700; }

a.leg-row:active { background: var(--surface-2); }
@media (hover: hover) { a.leg-row:hover { background: var(--surface-2); } }

/* 編集位置へ移動したときに光らせる */
.item.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }

/* 配分バー */
.alloc-bar-wrap { position: relative; margin: 4px 0; }
.alloc-bar-wrap.is-over { padding-top: 24px; }
.alloc-bar { display: flex; gap: 2px; height: 28px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.alloc-bar .seg { height: 100%; min-width: 0; }
.alloc-bar .seg:first-child { border-radius: 8px 0 0 8px; }
.alloc-bar .seg:last-child { border-radius: 0 8px 8px 0; }
.alloc-over {
  position: absolute; top: 24px; bottom: 0; right: 0; border-radius: 0 8px 8px 0; pointer-events: none;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--danger) 55%, transparent) 0 3px, transparent 3px 7px);
  outline: 2px solid var(--danger); outline-offset: -2px;
}
.alloc-marker { position: absolute; top: 20px; bottom: -4px; width: 2px; background: var(--text); transform: translateX(-1px); }
.alloc-marker span { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--text); }
.alloc-marker.at-start span { left: 0; transform: none; }
.alloc-marker.at-end span { left: auto; right: 0; transform: none; }
.alloc-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }
.legend { margin-top: 10px; font-size: 14px; }
.leg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 4.2em 12px; gap: 10px; align-items: center; min-height: 44px; padding: 0 0 0 2px; color: inherit; text-decoration: none; border-top: 1px solid var(--border); }
.leg-row > .num { text-align: right; white-space: nowrap; }
.leg-row .lbl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.leg-row.neg { color: var(--danger); font-weight: 700; }

/* ===== 入力 ===== */
.mini-summary {
  position: sticky; top: calc(65px + env(safe-area-inset-top)); z-index: 10;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px;
}
.mini-summary div { min-width: 0; }
.mini-summary .k { color: var(--text-2); font-weight: 600; }
.mini-summary .v { font-size: 15px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-summary.is-negative { border-color: var(--danger); background: var(--danger-bg); }
.mini-summary.is-negative .reserve .v, .mini-summary.is-negative .reserve .k { color: var(--danger); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 14px 0 12px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 0;
  padding: 6px 2px; min-height: 52px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  font-size: 13px; font-weight: 700; line-height: 1.3;
}
.tab .n { font-size: 11px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] .n { color: color-mix(in srgb, var(--accent-ink) 85%, transparent); }
.pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 4px 8px; }
.pane-head h2 { font-size: 18px; }
.pane-note { font-size: 13px; color: var(--text-3); margin: -4px 4px 10px; }
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.item.is-off { background: var(--surface-2); box-shadow: none; }
.item.is-off .fade { opacity: .5; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row > .grow { flex: 1 1 auto; min-width: 0; }
.amt-wrap { position: relative; flex: 0 0 8.2em; }
.amt-wrap::before { content: "¥"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.amt-wrap input { padding-left: 24px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.payday { flex: 0 0 6.2em; }
@media (max-width: 370px) { .amt-wrap { flex-basis: 7em; } .payday { flex-basis: 5.6em; } }
.stype { flex: 0 0 7.4em; }
.derived { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-2); padding: 0 4px; }
.derived b { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.sw { position: relative; flex: none; width: 46px; height: 28px; display: inline-block; }
.sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; min-height: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--switch-off); transition: background .15s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(18px); }
.sw input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.pane-foot { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 700; }
.total-row .v { font-size: 18px; }

<script>
'use strict';

/* =====================================================================
 * 設定
 * ===================================================================== */

// パスコードの SHA-256 ハッシュ（16進数・小文字）。パスコードそのものは書かない。
// 作り方は README.md の「パスコードの設定」を参照。
const PASSCODE_HASH = '42f0fa5ac5135466b793a54d3d9029212ad9948b616bb201e0dd4ce9edc522bd';

const SCHEMA_VERSION = 3;
const PLAN_KINDS = ['income', 'fixed', 'savings', 'variable'];
const MONTH_RE = /^\d{4}-(0[1-9]|1[0-2])$/;

// 初期カテゴリ（金額や個人の項目は入れない）
const DEFAULT_CATEGORIES = {
  income: ['給与', '副業', '賞与', '臨時収入', 'その他収入'],
  variable: ['日用品', '娯楽', '未分類', '外食', '交際費', '軽食', '散髪', '通院', '食費', '釣り', '固定費', 'その他'],
  savingsType: ['現金', '投資', '持ち株会'],
};
const CATEGORY_KEYS = Object.keys(DEFAULT_CATEGORIES);

// 各項目の種類ごとのフィールドと既定値
const ITEM_FIELDS = {
  income:   { category: '', amount: 0, memo: '' },
  fixed:    { name: '', amount: 0, payDay: '', memo: '' },
  savings:  { type: '', name: '', amount: 0, memo: '' },
  variable: { category: '', amount: 0, memo: '' },
};

/* =====================================================================
 * ストレージ層
 * localStorage に触れるのはこのブロックだけ。
 * 保存先を GAS（Google スプレッドシート）に切り替えるときは Storage を差し替える。
 * load() / save() は Promise を返す（将来の非同期通信に合わせるため）。
 * ===================================================================== */
const Storage = (() => {
  const DATA_KEY = 'okanePlan:data';
  const UNLOCK_KEY = 'okanePlan:unlockedHash';

  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  return {
    /** データ全体（JSON）を読み込む。未保存なら null。 */
    async load() {
      const raw = safeGet(DATA_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    },
    /** データ全体（JSON）を保存する。 */
    async save(data) {
      localStorage.setItem(DATA_KEY, JSON.stringify(data));
    },
    /** データ全体を削除する。 */
    async clear() {
      localStorage.removeItem(DATA_KEY);
    },

    // --- 端末ごとのロック解除フラグ（同期しない） ---
    /** 解除済みとして記録されたハッシュが、現在のハッシュと一致するか */
    isUnlocked(hash) { return safeGet(UNLOCK_KEY) === hash; },
    setUnlocked(hash) { try { localStorage.setItem(UNLOCK_KEY, hash); } catch (e) { /* 保存できなくても今回は開く */ } },
    clearUnlock() { try { localStorage.removeItem(UNLOCK_KEY); } catch (e) { /* noop */ } },
  };
})();

/* =====================================================================
 * データモデル
 * ===================================================================== */
const nowISO = () => new Date().toISOString();
const clone = (v) => JSON.parse(JSON.stringify(v));

function newId() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function createInitialData() {
  const t = nowISO();
  return {
    schemaVersion: SCHEMA_VERSION,
    updatedAt: t,
    categoriesUpdatedAt: t,
    categories: clone(DEFAULT_CATEGORIES),
    plans: {},
  };
}

function newItem(kind, fields) {
  return { id: newId(), enabled: true, ...clone(ITEM_FIELDS[kind]), ...(fields || {}), updatedAt: nowISO() };
}

function newPlan(month) {
  const t = nowISO();
  return {
    month, createdAt: t, updatedAt: t,
    // 変動費の入れ方: 'items' = 項目別に入力 / 'total' = 全体（1つの金額）で入力
    variableMode: 'items',
    variableTotal: 0,
    income: [], fixed: [], savings: [], variable: [],
  };
}

/** 既存の月をコピーして新しい月を作る（ID と更新日時は振り直す） */
function copyPlan(src, month) {
  const p = newPlan(month);
  p.variableMode = src.variableMode === 'total' ? 'total' : 'items';
  p.variableTotal = toAmount(src.variableTotal);
  for (const kind of PLAN_KINDS) {
    p[kind] = (src[kind] || []).map((it) => ({ ...clone(it), id: newId(), updatedAt: p.createdAt }));
  }
  return p;
}

/** 金額を数値（0 以上の整数）に変換。全角数字・カンマ・¥ を許容。 */
function toAmount(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.max(0, Math.round(v)) : 0;
  const s = String(v == null ? '' : v)
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[^0-9]/g, '');
  return s ? Math.min(Number(s), 999999999999) : 0;
}

/** 古い schemaVersion のデータを最新に変換する */
function migrate(d) {
  const v = Number(d.schemaVersion || 1);
  if (v > SCHEMA_VERSION) throw new Error('このアプリより新しい形式のデータです（schemaVersion ' + v + '）');
  if (v < 2) {
    // v1 → v2: 変動費の入れ方（variableMode / variableTotal）を追加。既存の月は項目別のまま
    for (const p of Object.values(d.plans || {})) {
      if (p && typeof p === 'object') { p.variableMode = 'items'; p.variableTotal = 0; }
    }
    d.schemaVersion = 2;
  }
  if (v < 3) {
    // v2 → v3: 変動費カテゴリを新しい初期値（家計簿アプリと同じ項目・順番）に置き換える
    const OLD_VARIABLE = ['飲み代', '外食費', '旅費', 'いろいろ', '食費', '日用品', '交通費', '美容', '医療', '娯楽', '服飾', 'プレゼント', '学習', '趣味', 'その他'];
    const NEW_VARIABLE = DEFAULT_CATEGORIES.variable;
    const dropped = OLD_VARIABLE.filter((c) => !NEW_VARIABLE.includes(c));
    if (d.categories && Array.isArray(d.categories.variable)) {
      // 自分で追加したカテゴリは消さずに後ろへ残す
      const extras = d.categories.variable.filter((c) => !OLD_VARIABLE.includes(c) && !NEW_VARIABLE.includes(c));
      d.categories.variable = [...NEW_VARIABLE, ...extras];
      d.categoriesUpdatedAt = new Date().toISOString();
    }
    for (const p of Object.values(d.plans || {})) {
      if (!p || !Array.isArray(p.variable)) continue;
      p.variable = p.variable
        .map((it) => (it && it.category === '外食費' ? { ...it, category: '外食' } : it))
        // なくなったカテゴリの、金額もメモも空の項目は片付ける（金額やメモがあれば残す）
        .filter((it) => !(it && dropped.includes(it.category) && !toAmount(it.amount) && !String(it.memo || '').trim()));
    }
    d.schemaVersion = 3;
  }
  return d;
}

/** 読み込んだデータを検証・補完して、正しい形に揃える */
function normalizeData(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('データの形式が正しくありません');
  const d = migrate(raw);
  const str = (v) => (typeof v === 'string' ? v : '');
  const out = {
    schemaVersion: SCHEMA_VERSION,
    updatedAt: str(d.updatedAt) || nowISO(),
    categoriesUpdatedAt: str(d.categoriesUpdatedAt) || str(d.updatedAt) || nowISO(),
    categories: {},
    plans: {},
  };
  const cats = d.categories || {};
  for (const key of CATEGORY_KEYS) {
    out.categories[key] = Array.isArray(cats[key])
      ? [...new Set(cats[key].map((c) => String(c).trim()).filter(Boolean))]
      : clone(DEFAULT_CATEGORIES[key]);
  }
  const plans = d.plans && typeof d.plans === 'object' ? d.plans : {};
  for (const [month, p] of Object.entries(plans)) {
    if (!MONTH_RE.test(month) || !p || typeof p !== 'object') continue;
    const plan = {
      month,
      createdAt: str(p.createdAt) || nowISO(),
      updatedAt: str(p.updatedAt) || nowISO(),
      variableMode: p.variableMode === 'total' ? 'total' : 'items',
      variableTotal: toAmount(p.variableTotal),
    };
    for (const kind of PLAN_KINDS) {
      plan[kind] = (Array.isArray(p[kind]) ? p[kind] : []).filter((it) => it && typeof it === 'object').map((it) => {
        const item = { id: str(it.id) || newId(), enabled: it.enabled !== false };
        for (const [f, def] of Object.entries(ITEM_FIELDS[kind])) {
          item[f] = typeof def === 'number' ? toAmount(it[f]) : (it[f] == null ? '' : String(it[f]));
        }
        item.updatedAt = str(it.updatedAt) || nowISO();
        return item;
      });
    }
    out.plans[month] = plan;
  }
  return out;
}

/* =====================================================================
 * 計算（純粋関数）
 * ===================================================================== */
function daysInMonth(month) {
  const [y, m] = month.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

const sumEnabled = (items) => items.reduce((s, it) => s + (it.enabled ? toAmount(it.amount) : 0), 0);

function calcPlan(plan, savingsTypes) {
  const income = sumEnabled(plan.income);
  const fixed = sumEnabled(plan.fixed);
  const savings = sumEnabled(plan.savings);
  const variableIsTotal = plan.variableMode === 'total';
  const variable = variableIsTotal ? toAmount(plan.variableTotal) : sumEnabled(plan.variable);
  const spendAndSave = fixed + variable + savings; // 支出＋貯金
  const reserve = income - spendAndSave;           // 予備費
  const ratio = (v) => (income > 0 ? v / income : null);

  // 貯金の種別ごとの小計（マスタの順 → マスタ外の種別）
  const types = [...(savingsTypes || [])];
  for (const it of plan.savings) if (it.type && !types.includes(it.type)) types.push(it.type);
  const savingsByType = types.map((type) => ({
    type,
    amount: plan.savings.filter((it) => it.enabled && it.type === type).reduce((s, it) => s + toAmount(it.amount), 0),
  }));
  const untyped = plan.savings.filter((it) => it.enabled && !it.type).reduce((s, it) => s + toAmount(it.amount), 0);
  if (untyped) savingsByType.push({ type: '（種別なし）', amount: untyped });

  // 収入のカテゴリごとの小計（マスタ外も含め、出てきた順）
  const incomeByCategory = [];
  for (const it of plan.income) {
    if (!it.enabled) continue;
    const name = it.category || '（項目なし）';
    const row = incomeByCategory.find((r) => r.name === name);
    if (row) row.amount += toAmount(it.amount); else incomeByCategory.push({ name, amount: toAmount(it.amount) });
  }

  return {
    income, fixed, savings, variable, spendAndSave, reserve, variableIsTotal,
    savingsRate: ratio(savings),
    share: { fixed: ratio(fixed), variable: ratio(variable), savings: ratio(savings), reserve: ratio(reserve) },
    savingsByType,
    incomeByCategory,
    variableWeekly: variable * 12 / 365 * 7,
    variableDaily: variable / daysInMonth(plan.month),
    days: daysInMonth(plan.month),
  };
}

/** 変動費の自動計算（週あたり・1日あたり・変動費内割合） */
function calcVariableItem(item, days, variableTotal) {
  const a = toAmount(item.amount);
  return {
    weekly: a * 12 / 365 * 7,
    daily: a / days,
    share: item.enabled && variableTotal > 0 ? a / variableTotal : null,
  };
}

/* =====================================================================
 * 表示用ヘルパー
 * ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('ja-JP', { maximumFractionDigits: 0 });
const yen = (n) => (n < 0 ? '−¥' : '¥') + nf.format(Math.abs(Math.round(n)));
const pct = (r) => (r == null || !Number.isFinite(r) ? '—' : (r * 100).toFixed(1) + '%');
const fmtInputAmount = (n) => (n ? nf.format(n) : '');
const monthLabel = (m) => { const [y, mo] = m.split('-'); return `${y}年${Number(mo)}月`; };
const monthKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
const currentMonthKey = () => { const d = new Date(); return monthKey(d.getFullYear(), d.getMonth() + 1); };

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
}

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

/* =====================================================================
 * アプリの状態
 * ===================================================================== */
const state = {
  homeOpen: new Set(), // ホームで開いている項目（income / fixed / variable / savings）
  data: null,
  month: null,
  view: 'home',
  tab: 'income',
};
const plan = () => state.data.plans[state.month];
const cats = () => state.data.categories;

// --- 保存（入力中は少し待ってまとめて保存） ---
let saveTimer = null;
function commit({ immediate = false } = {}) {
  state.data.updatedAt = nowISO();
  clearTimeout(saveTimer);
  if (immediate) flushSave();
  else saveTimer = setTimeout(flushSave, 300);
}
async function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    await Storage.save(state.data);
  } catch (e) {
    console.error(e);
    toast('保存できませんでした（ブラウザの保存領域を確認してください）');
  }
}
function touchItem(item) {
  item.updatedAt = nowISO();
  plan().updatedAt = item.updatedAt;
}

/* =====================================================================
 * 月の扱い
 * ===================================================================== */
function sortedMonths() { return Object.keys(state.data.plans).sort(); }

function pickDefaultMonth() {
  const months = sortedMonths();
  const cur = currentMonthKey();
  if (months.includes(cur)) return cur;
  const past = months.filter((m) => m < cur);
  return past.length ? past[past.length - 1] : months[months.length - 1];
}

function ensureAnyPlan() {
  if (!sortedMonths().length) {
    const m = currentMonthKey();
    state.data.plans[m] = newPlan(m);
    commit({ immediate: true });
  }
}

function renderMonthSelect() {
  const sel = $('#month-select');
  sel.innerHTML = sortedMonths().slice().reverse()
    .map((m) => `<option value="${m}" ${m === state.month ? 'selected' : ''}>${monthLabel(m)}</option>`).join('');
}

function setMonth(m) {
  state.month = m;
  renderMonthSelect();
  renderAll();
}

function openNewMonthDialog() {
  const months = sortedMonths();
  const latest = months[months.length - 1] || currentMonthKey();
  let [y, m] = latest.split('-').map(Number);
  if (months.length) { m += 1; if (m > 12) { m = 1; y += 1; } }
  const thisYear = new Date().getFullYear();
  const years = [];
  for (let i = Math.min(thisYear - 2, y - 1); i <= Math.max(thisYear + 3, y + 1); i++) years.push(i);

  const html = `
    <div class="overlay" data-close>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nm-title">
        <h2 id="nm-title">新しい月を作成</h2>
        <form id="nm-form">
          <div class="field"><span>対象月</span>
            <div class="field-row">
              <select id="nm-year" aria-label="年">${years.map((v) => `<option value="${v}" ${v === y ? 'selected' : ''}>${v}年</option>`).join('')}</select>
              <select id="nm-month" aria-label="月">${Array.from({ length: 12 }, (_, i) => i + 1).map((v) => `<option value="${v}" ${v === m ? 'selected' : ''}>${v}月</option>`).join('')}</select>
            </div>
          </div>
          <div class="field"><span>作り方</span>
            <select id="nm-source">
              ${months.slice().reverse().map((mm) => `<option value="${mm}">${monthLabel(mm)} をコピー</option>`).join('')}
              <option value="">空の計画から始める</option>
            </select>
          </div>
          <p class="help">コピーすると、収入・固定費・貯金投資・変動費の項目と金額をそのまま引き継ぎます。</p>
          <p id="nm-error" class="error-text" role="alert"></p>
          <div class="sheet-actions">
            <button type="button" class="btn ghost" data-close>キャンセル</button>
            <button type="submit" class="btn primary">作成</button>
          </div>
        </form>
      </div>
    </div>`;
  const root = openModal(html);
  const syncSource = () => {
    // 作成する月より前で一番新しい月をコピー元の既定にする
    const target = monthKey($('#nm-year', root).value, $('#nm-month', root).value);
    const before = months.filter((mm) => mm < target);
    const src = $('#nm-source', root);
    src.value = before.length ? before[before.length - 1] : (months.length ? months[months.length - 1] : '');
  };
  $('#nm-year', root).addEventListener('change', syncSource);
  $('#nm-month', root).addEventListener('change', syncSource);
  syncSource();
  $('#nm-form', root).addEventListener('submit', (e) => {
    e.preventDefault();
    const target = monthKey($('#nm-year', root).value, $('#nm-month', root).value);
    if (state.data.plans[target]) { $('#nm-error', root).textContent = `${monthLabel(target)} の計画はすでにあります。`; return; }
    const src = $('#nm-source', root).value;
    state.data.plans[target] = src ? copyPlan(state.data.plans[src], target) : newPlan(target);
    commit({ immediate: true });
    closeModal();
    setMonth(target);
    toast(`${monthLabel(target)} を作成しました`);
  });
}

function openModal(html) {
  const root = $('#modal-root');
  root.innerHTML = html;
  root.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', (e) => {
    if (e.target === el) closeModal();
  }));
  const first = root.querySelector('select, input, button.primary');
  if (first) setTimeout(() => first.focus(), 30);
  return root;
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* =====================================================================
 * 画面: ホーム
 * ===================================================================== */
const SERIES = [
  { key: 'fixed', label: '固定費', color: 'var(--series-fixed)', tab: 'fixed' },
  { key: 'variable', label: '変動費予算', color: 'var(--series-variable)', tab: 'variable' },
  { key: 'savings', label: '貯金・投資', color: 'var(--series-savings)', tab: 'savings' },
  { key: 'reserve', label: '予備費', color: 'var(--series-reserve)' },
];

function allocationHTML(c) {
  if (c.income <= 0 && c.spendAndSave <= 0) {
    return `<div class="empty">収入と予算を入力すると、配分が表示されます。</div>`;
  }
  const over = c.reserve < 0;
  // 予備費がマイナスのときは「支出＋貯金」を 100% として描き、収入の位置に線を引く
  const base = over ? c.spendAndSave : c.income;
  const parts = SERIES.filter((s) => !(over && s.key === 'reserve'))
    .map((s) => ({ ...s, value: c[s.key] }))
    .filter((s) => s.value > 0);
  const segs = parts.map((s) => {
    const w = (s.value / base) * 100;
    const tip = `${s.label} ${yen(s.value)}（収入比 ${pct(c.share[s.key])}）`;
    return `<div class="seg" style="flex:0 0 calc(${w}% - 2px);background:${s.color}" title="${esc(tip)}" aria-label="${esc(tip)}" role="img"></div>`;
  }).join('');
  let overlay = '';
  if (over) {
    const incomePos = (c.income / base) * 100;
    overlay = `
      <div class="alloc-over" style="left:${incomePos}%"></div>
      <div class="alloc-marker ${incomePos < 25 ? 'at-start' : incomePos > 75 ? 'at-end' : ''}" style="left:${incomePos}%"><span>収入 ${yen(c.income)}</span></div>`;
  }
  const rows = SERIES.map((s) => {
    const v = c[s.key];
    const neg = s.key === 'reserve' && v < 0;
    const inner = `
      <span class="lbl"><span class="swatch" style="background:${s.color}"></span>${s.label}${neg ? '（不足）' : ''}</span>
      <span class="num">${yen(v)}</span>
      <span class="num">${pct(c.share[s.key])}</span>`;
    return s.tab
      ? `<a class="leg-row" href="#input/${s.tab}">${inner}<span class="chev" aria-hidden="true">›</span></a>`
      : `<div class="leg-row ${neg ? 'neg' : ''}">${inner}<span></span></div>`;
  }).join('');
  return `
    <div class="alloc-bar-wrap ${over ? 'is-over' : ''}">
      <div class="alloc-bar">${segs}</div>
      ${overlay}
    </div>
    <div class="alloc-scale"><span>0</span><span>${over ? '支出＋貯金 ' + yen(c.spendAndSave) : '収入 ' + yen(c.income)}</span></div>
    <div class="legend" aria-label="収入比の配分">${rows}</div>`;
}

const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const ICON_CARET = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_CHART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>';
const GROUP_COLORS = { income: 'var(--tone-in)', fixed: 'var(--series-fixed)', variable: 'var(--series-variable)', savings: 'var(--series-savings)' };

/** 10,000 以上は「1.2万」のように短くする（グラフのラベル用） */
function shortYen(n) {
  const a = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  if (a < 10000) return sign + '¥' + nf.format(Math.round(a));
  return sign + (a / 10000).toFixed(a < 100000 ? 1 : 0).replace(/\.0$/, '') + '万';
}

/** ホームの小項目（1 件ずつ）の表示用データ */
function homeSubItems(kind, p, c) {
  const items = kind === 'variable' ? sortByCategoryOrder(p.variable, cats().variable) : p[kind];
  return items.map((it) => {
    const sub = [];
    let title;
    if (kind === 'income') title = it.category || '（項目なし）';
    else if (kind === 'fixed') { title = it.name || '（無題）'; if (it.payDay) sub.push(it.payDay === '末' ? '月末払い' : `${it.payDay}日払い`); }
    else if (kind === 'savings') { title = it.name || '（無題）'; if (it.type) sub.push(it.type); }
    else { title = it.category || '（項目なし）'; if (it.enabled && toAmount(it.amount)) sub.push('1日 ' + yen(toAmount(it.amount) / c.days)); }
    if (it.memo) sub.push(it.memo);
    return { id: it.id, title, sub: sub.join(' · '), amount: toAmount(it.amount), enabled: it.enabled };
  });
}

/** タップで小項目が開く行（右の鉛筆はその入力タブへ、小項目はその項目の編集位置へ） */
function expandRowHTML({ kind, title, sub, value, total, minus, p, c }) {
  const open = state.homeOpen.has(kind);
  const color = GROUP_COLORS[kind];
  const subs = kind === 'variable' && c.variableIsTotal
    ? [{ id: 'total', title: '全体で入力', sub: `1日 ${yen(c.variableDaily)} · 週 ${yen(c.variableWeekly)}`, amount: c.variable, enabled: true }]
    : homeSubItems(kind, p, c);
  const subHTML = subs.length ? subs.map((x) => {
    const w = total > 0 && x.enabled ? Math.max(1.5, (x.amount / total) * 100) : 0;
    return `<a class="srow ${x.enabled ? '' : 'is-off'}" href="#input/${kind}/${esc(x.id)}" aria-label="${esc(x.title)} を編集">
        <span class="sl">
          <span class="st">${esc(x.title)}${x.enabled ? '' : '<span class="off-tag">オフ</span>'}</span>
          ${x.sub ? `<span class="ss">${esc(x.sub)}</span>` : ''}
          <span class="sbar" aria-hidden="true"><i style="width:${w}%;background:${color}"></i></span>
        </span>
        <span class="sv num">${minus && x.amount > 0 ? '−' : ''}${yen(x.amount)}</span>
        <span class="edit-ico" aria-hidden="true">${ICON_EDIT}</span>
      </a>`;
  }).join('')
    : `<a class="srow" href="#input/${kind}"><span class="sl"><span class="st muted">まだ項目がありません</span></span><span class="add-link">追加する</span></a>`;
  return `
    <div class="xrow ${open ? 'open' : ''}" data-kind="${kind}">
      <div class="xhead">
        <button type="button" class="xtoggle" data-toggle="${kind}" aria-expanded="${open}" aria-controls="subs-${kind}">
          <span class="swatch" style="background:${color}"></span>
          <span class="l"><span class="t">${title}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</span>
          <span class="v num">${value}</span>
          ${ICON_CARET}
        </button>
        <a class="edit-btn" href="#input/${kind}" aria-label="${title}を編集">${ICON_EDIT}</a>
      </div>
      <div class="xbody" id="subs-${kind}" ${open ? '' : 'inert'}><div class="xinner">${subHTML}</div></div>
    </div>`;
}

/** グラフ: 変動費の内訳（カテゴリごと、多い順） */
function variableBreakdownHTML(p, c) {
  if (c.variableIsTotal) return '';
  const rows = [];
  for (const it of sortByCategoryOrder(p.variable, cats().variable)) {
    const a = toAmount(it.amount);
    if (!it.enabled || !a) continue;
    const name = it.category || '（項目なし）';
    const r = rows.find((x) => x.name === name);
    if (r) r.amount += a; else rows.push({ name, amount: a, id: it.id });
  }
  if (!rows.length) return '';
  rows.sort((x, y) => y.amount - x.amount);
  const max = rows[0].amount;
  return `
    <div class="card">
      <div class="chart-title">変動費の内訳<span class="muted num">合計 ${yen(c.variable)}</span></div>
      <div>${rows.map((r) => `
        <a class="hbar" href="#input/variable/${esc(r.id)}" title="${esc(r.name)} ${yen(r.amount)}（変動費の ${pct(r.amount / c.variable)}）">
          <span class="hb-top"><span class="hb-name">${esc(r.name)}</span><span class="hb-val num">${yen(r.amount)}</span><span class="hb-pct num">${pct(r.amount / c.variable)}</span></span>
          <span class="hb-track" aria-hidden="true"><i style="width:${(r.amount / max) * 100}%"></i></span>
        </a>`).join('')}
      </div>
    </div>`;
}

/** グラフ: 月別の推移（直近 6 か月。棒 = 固定費・変動費・貯金、線 = 収入） */
function monthTrendHTML() {
  const months = sortedMonths().slice(-6);
  const data = months.map((m) => ({ m, c: calcPlan(state.data.plans[m], cats().savingsType) }));
  const max = Math.max(1, ...data.map(({ c }) => Math.max(c.income, c.spendAndSave)));
  const H = 140;
  const seg = (v, color) => (v > 0 ? `<i style="height:${Math.max(2, (v / max) * H)}px;background:${color}"></i>` : '');
  const cols = data.map(({ m, c }) => {
    const label = `${monthLabel(m)}: 収入 ${yen(c.income)}、固定費 ${yen(c.fixed)}、変動費 ${yen(c.variable)}、貯金 ${yen(c.savings)}、予備費 ${yen(c.reserve)}`;
    return `
      <button type="button" class="mcol ${m === state.month ? 'cur' : ''}" data-month="${m}" title="${esc(label)}" aria-label="${esc(label)}">
        <span class="mplot" style="height:${H}px">
          <span class="mstack">${seg(c.fixed, 'var(--series-fixed)')}${seg(c.variable, 'var(--series-variable)')}${seg(c.savings, 'var(--series-savings)')}</span>
          ${c.income > 0 ? `<span class="mincome" style="bottom:${(c.income / max) * H}px"></span>` : ''}
        </span>
        <span class="mlabel">${Number(m.slice(5))}月</span>
        <span class="mres num ${c.reserve < 0 ? 'neg' : ''}">${shortYen(c.reserve)}</span>
      </button>`;
  }).join('');
  return `
    <div class="card">
      <div class="chart-title">月別の推移<span class="muted">下の数字は予備費</span></div>
      <div class="trend-legend">
        <span><span class="swatch" style="background:var(--series-fixed)"></span>固定費</span>
        <span><span class="swatch" style="background:var(--series-variable)"></span>変動費</span>
        <span><span class="swatch" style="background:var(--series-savings)"></span>貯金</span>
        <span><span class="line-swatch"></span>収入</span>
      </div>
      <div class="trend">${cols}</div>
      <p class="chart-note">${months.length < 2 ? '月を追加すると、ここに推移が並びます。' : '棒が線（収入）より上に出ている月は予算オーバーです。'}タップするとその月に切り替わります。</p>
    </div>`;
}

function setupHomeEvents() {
  const root = $('#view-home');
  root.addEventListener('click', (e) => {
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const kind = toggle.dataset.toggle;
      const row = toggle.closest('.xrow');
      const open = !state.homeOpen.has(kind);
      if (open) state.homeOpen.add(kind); else state.homeOpen.delete(kind);
      row.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
      row.querySelector('.xbody').inert = !open;
      return;
    }
    const col = e.target.closest('[data-month]');
    if (col && col.dataset.month !== state.month) setMonth(col.dataset.month);
  });
}

/* =====================================================================
 * 画面: 入力
 * ===================================================================== */
const PANES = {
  income:   { step: 1, short: '収入', title: '収入見積', note: 'この月に入ってくる見込みの金額。', add: '収入を追加' },
  fixed:    { step: 2, short: '固定費', title: '固定費', note: '家賃・通信・サブスクなど、毎月ほぼ決まっている支出。', add: '固定費を追加' },
  savings:  { step: 3, short: '貯金', title: '貯金・投資計画', note: '先に確保する貯金・投資の金額。', add: '貯金・投資を追加' },
  variable: { step: 4, short: '変動費', title: '変動費予算', note: '使い方で変わる支出の月予算。週・1日あたりの目安を自動計算します。', add: '変動費を追加' },
};

function optionList(values, current, placeholder) {
  const list = [...values];
  let html = placeholder != null ? `<option value="" ${current ? '' : 'selected'}>${esc(placeholder)}</option>` : '';
  html += list.map((v) => `<option value="${esc(v)}" ${v === current ? 'selected' : ''}>${esc(v)}</option>`).join('');
  if (current && !list.includes(current)) html += `<option value="${esc(current)}" selected>${esc(current)}（未登録）</option>`;
  return html;
}

function paydayOptions(current) {
  let html = `<option value="" ${current ? '' : 'selected'}>支払日</option>`;
  for (let d = 1; d <= 31; d++) html += `<option value="${d}" ${String(d) === current ? 'selected' : ''}>${d}日</option>`;
  html += `<option value="末" ${current === '末' ? 'selected' : ''}>月末</option>`;
  if (current && !/^([1-9]|[12]\d|3[01]|末)$/.test(current)) html += `<option value="${esc(current)}" selected>${esc(current)}</option>`;
  return html;
}

/** 変動費の項目をカテゴリマスタの順に並べる（マスタにないものは後ろ、同じカテゴリは入力順） */
function sortByCategoryOrder(items, order) {
  const rank = (it) => { const i = order.indexOf(it.category); return i < 0 ? order.length : i; };
  return items.map((it, i) => ({ it, i })).sort((a, b) => rank(a.it) - rank(b.it) || a.i - b.i).map((x) => x.it);
}

function totalDerivedHTML(c) {
  return `<span>週 <b>${yen(c.variableWeekly)}</b></span><span>1日 <b>${yen(c.variableDaily)}</b></span><span>${c.days}日の月</span>`;
}

function derivedHTML(item, c) {
  const d = calcVariableItem(item, c.days, c.variable);
  return `<span>週 <b>${yen(d.weekly)}</b></span><span>1日 <b>${yen(d.daily)}</b></span><span>変動費内 <b>${pct(d.share)}</b></span>`;
}

function itemHTML(kind, item, c) {
  const sw = `<label class="sw" title="集計に含める"><input type="checkbox" data-f="enabled" ${item.enabled ? 'checked' : ''} aria-label="有効（集計に含める）"><span></span></label>`;
  const amt = `<div class="amt-wrap fade"><input data-f="amount" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="${fmtInputAmount(item.amount)}" placeholder="0" aria-label="金額"></div>`;
  const memo = `<input class="grow fade" data-f="memo" value="${esc(item.memo)}" placeholder="メモ" aria-label="メモ" autocomplete="off">`;
  const del = `<button type="button" class="icon-btn" data-act="del" aria-label="この項目を削除" title="削除">×</button>`;
  let body = '';
  if (kind === 'income') {
    body = `
      <div class="row">${sw}<select class="grow fade" data-f="category" aria-label="収入項目">${optionList(cats().income, item.category, '収入項目')}</select>${amt}</div>
      <div class="row">${memo}${del}</div>`;
  } else if (kind === 'fixed') {
    body = `
      <div class="row">${sw}<input class="grow fade" data-f="name" value="${esc(item.name)}" placeholder="項目（例: 家賃）" aria-label="項目" autocomplete="off">${amt}</div>
      <div class="row"><select class="payday fade" data-f="payDay" aria-label="支払日">${paydayOptions(item.payDay)}</select>${memo}${del}</div>`;
  } else if (kind === 'savings') {
    body = `
      <div class="row">${sw}<input class="grow fade" data-f="name" value="${esc(item.name)}" placeholder="貯金先・投資先" aria-label="貯金先・投資先" autocomplete="off">${amt}</div>
      <div class="row"><select class="stype fade" data-f="type" aria-label="種別">${optionList(cats().savingsType, item.type, '種別')}</select>${memo}${del}</div>`;
  } else {
    body = `
      <div class="row">${sw}<select class="grow fade" data-f="category" aria-label="変動費の項目">${optionList(cats().variable, item.category, '項目')}</select>${amt}</div>
      <div class="derived fade" data-derived>${derivedHTML(item, c)}</div>
      <div class="row">${memo}${del}</div>`;
  }
  return `<div class="item ${item.enabled ? '' : 'is-off'}" data-id="${esc(item.id)}">${body}</div>`;
}

function renderInputTabs(c) {
  const totals = { income: c.income, fixed: c.fixed, savings: c.savings, variable: c.variable };
  $('#input-tabs').innerHTML = PLAN_KINDS.map((k) => `
    <button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">
      <span>${PANES[k].step} ${PANES[k].short}</span><span class="n">${yen(totals[k])}</span>
    </button>`).join('');
}

function renderMiniSummary(c) {
  const el = $('#mini-summary');
  el.classList.toggle('is-negative', c.reserve < 0);
  el.innerHTML = `
    <div><div class="k">収入</div><div class="v num">${yen(c.income)}</div></div>
    <div><div class="k">支出＋貯金</div><div class="v num">${yen(c.spendAndSave)}</div></div>
    <div class="reserve"><div class="k">${c.reserve < 0 ? '⚠ 予備費' : '予備費'}</div><div class="v num">${yen(c.reserve)}</div></div>`;
}

function paneFootHTML(kind, c) {
  const items = plan()[kind];
  const on = items.filter((i) => i.enabled).length;
  let sub = '';
  if (kind === 'savings') {
    sub = `<div class="total-sub">${c.savingsByType.map((t) => `<span>${esc(t.type)} <b class="num">${yen(t.amount)}</b></span>`).join('')}</div>`;
  } else if (kind === 'variable') {
    sub = `<div class="total-sub"><span>週あたり <b class="num">${yen(c.variableWeekly)}</b></span><span>1日あたり <b class="num">${yen(c.variableDaily)}</b></span></div>`;
  }
  const note = kind === 'variable' && c.variableIsTotal ? '全体で入力' : `有効 ${on}/${items.length}件`;
  return `
    <div class="total-row"><span>${PANES[kind].title} 合計 <span class="muted" style="font-weight:500;font-size:13px">（${note}）</span></span><span class="v num">${yen(c[kind])}</span></div>
    ${sub}`;
}

function renderInputPane() {
  const kind = state.tab;
  const p = plan();
  const c = calcPlan(p, cats().savingsType);
  const cfg = PANES[kind];
  const items = p[kind];
  const next = PLAN_KINDS[PLAN_KINDS.indexOf(kind) + 1];
  const nextHTML = next
    ? `<button type="button" class="btn ghost" data-tab="${next}">次へ：${PANES[next].step}. ${PANES[next].title} →</button>`
    : `<a class="btn ghost" href="#home">予備費を確認する →</a>`;

  // 変動費を「全体で入力」するとき
  const modeSwitch = kind === 'variable' ? `
    <div class="seg-ctl" role="group" aria-label="変動費の入れ方">
      <button type="button" data-vmode="total" aria-pressed="${c.variableIsTotal}">全体で入力</button>
      <button type="button" data-vmode="items" aria-pressed="${!c.variableIsTotal}">項目別に入力</button>
    </div>` : '';
  if (kind === 'variable' && c.variableIsTotal) {
    const kept = items.length ? `<p class="help">項目別の内訳（${items.length}件）は消さずに残してあります。「項目別に入力」に戻すと、内訳の合計で計算します。</p>` : '';
    $('#input-pane').innerHTML = `
      <div class="pane-head"><h2>${cfg.step}. ${cfg.title}</h2></div>
      ${modeSwitch}
      <p class="pane-note">1か月の変動費を、項目に分けずに 1 つの金額で入れます。</p>
      <div class="item">
        <div class="row"><span class="grow vt-label">変動費予算（1か月の全体）</span>
          <div class="amt-wrap"><input data-plan-f="variableTotal" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="${fmtInputAmount(p.variableTotal)}" placeholder="0" aria-label="変動費予算（全体）"></div></div>
        <div class="derived" data-derived-total>${totalDerivedHTML(c)}</div>
      </div>
      ${kept}
      <div class="pane-foot">
        <div id="pane-foot">${paneFootHTML(kind, c)}</div>
        <div class="next-step">${nextHTML}</div>
      </div>`;
    renderInputTabs(c);
    renderMiniSummary(c);
    return;
  }

  let extra = '';
  if (kind === 'variable') {
    const missing = cats().variable.filter((v) => !items.some((i) => i.category === v));
    if (missing.length) extra = `<button type="button" class="btn block" data-act="add-missing">未追加のカテゴリをまとめて追加（${missing.length}件）</button>`;
  }
  $('#input-pane').innerHTML = `
    <div class="pane-head"><h2>${cfg.step}. ${cfg.title}</h2></div>
    ${modeSwitch}
    <p class="pane-note">${cfg.note}スイッチを切ると、消さずに集計から外せます。</p>
    <div class="items" id="items">
      ${items.length ? (kind === 'variable' ? sortByCategoryOrder(items, cats().variable) : items).map((it) => itemHTML(kind, it, c)).join('') : '<div class="empty">まだ項目がありません</div>'}
    </div>
    <div class="pane-foot">
      <button type="button" class="btn primary block" data-act="add">＋ ${cfg.add}</button>
      ${extra}
      <div id="pane-foot">${paneFootHTML(kind, c)}</div>
      <div class="next-step">${nextHTML}</div>
    </div>`;
  renderInputTabs(c);
  renderMiniSummary(c);
}

/** 入力中の再計算（フォーカスを保つため、リストは描き直さない） */
function refreshInputTotals() {
  const c = calcPlan(plan(), cats().savingsType);
  renderInputTabs(c);
  renderMiniSummary(c);
  $('#pane-foot').innerHTML = paneFootHTML(state.tab, c);
  const totalEl = document.querySelector('[data-derived-total]');
  if (totalEl) totalEl.innerHTML = totalDerivedHTML(c);
  if (state.tab === 'variable') {
    for (const it of plan().variable) {
      const el = document.querySelector(`.item[data-id="${CSS.escape(it.id)}"] [data-derived]`);
      if (el) el.innerHTML = derivedHTML(it, c);
    }
  }
}

function findItem(el) {
  const card = el.closest('.item');
  if (!card) return null;
  const item = plan()[state.tab].find((i) => i.id === card.dataset.id);
  return item ? { card, item } : null;
}

function setupInputEvents() {
  const pane = $('#input-pane');

  pane.addEventListener('input', (e) => {
    if (e.target.dataset.planF === 'variableTotal') {
      plan().variableTotal = toAmount(e.target.value);
      plan().updatedAt = nowISO();
      commit();
      refreshInputTotals();
      return;
    }
    const f = e.target.dataset.f;
    const hit = f && findItem(e.target);
    if (!hit) return;
    if (f === 'amount') hit.item.amount = toAmount(e.target.value);
    else if (f === 'enabled') return; // change で処理
    else hit.item[f] = e.target.value;
    touchItem(hit.item);
    commit();
    if (f === 'amount') refreshInputTotals();
  });

  pane.addEventListener('change', (e) => {
    if (e.target.dataset.planF === 'variableTotal') {
      plan().variableTotal = toAmount(e.target.value);
      plan().updatedAt = nowISO();
      e.target.value = fmtInputAmount(plan().variableTotal);
      commit();
      refreshInputTotals();
      return;
    }
    const f = e.target.dataset.f;
    const hit = f && findItem(e.target);
    if (!hit) return;
    if (f === 'enabled') {
      hit.item.enabled = e.target.checked;
      hit.card.classList.toggle('is-off', !hit.item.enabled);
    } else if (f === 'amount') {
      hit.item.amount = toAmount(e.target.value);
      e.target.value = fmtInputAmount(hit.item.amount);
    } else {
      hit.item[f] = e.target.value;
    }
    touchItem(hit.item);
    commit();
    refreshInputTotals();
  });

  // 金額欄: 入力を終えたらカンマ区切りに整える
  const isAmountInput = (el) => el.dataset.f === 'amount' || el.dataset.planF === 'variableTotal';
  pane.addEventListener('focusout', (e) => {
    if (isAmountInput(e.target)) e.target.value = fmtInputAmount(toAmount(e.target.value));
  });
  pane.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur();
  });

  pane.addEventListener('click', (e) => {
    const btn = e.target.closest('button, a');
    if (!btn) return;
    const kind = state.tab;
    const p = plan();
    if (btn.dataset.tab) { switchTab(btn.dataset.tab); return; }
    if (btn.dataset.vmode) {
      const mode = btn.dataset.vmode === 'total' ? 'total' : 'items';
      if (p.variableMode === mode) return;
      // 全体入力に切り替えたとき、まだ金額がなければ項目別の合計を初期値にする
      if (mode === 'total' && !p.variableTotal) p.variableTotal = sumEnabled(p.variable);
      p.variableMode = mode;
      p.updatedAt = nowISO();
      commit({ immediate: true });
      renderInputPane();
      return;
    }
    if (btn.dataset.act === 'add') {
      const item = newItem(kind, defaultFieldsFor(kind));
      p[kind].push(item);
      p.updatedAt = item.updatedAt;
      commit({ immediate: true });
      renderInputPane();
      const card = document.querySelector(`.item[data-id="${CSS.escape(item.id)}"]`);
      if (card) {
        card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        const focusEl = card.querySelector(kind === 'fixed' || kind === 'savings' ? '[data-f="name"]' : '[data-f="amount"]');
        if (focusEl) focusEl.focus({ preventScroll: true });
      }
    } else if (btn.dataset.act === 'add-missing') {
      const missing = cats().variable.filter((v) => !p.variable.some((i) => i.category === v));
      for (const v of missing) p.variable.push(newItem('variable', { category: v }));
      p.updatedAt = nowISO();
      commit({ immediate: true });
      renderInputPane();
      toast(`${missing.length}件追加しました`);
    } else if (btn.dataset.act === 'del') {
      const hit = findItem(btn);
      if (!hit) return;
      const label = hit.item.name || hit.item.category || '（無題）';
      if (!confirm(`「${label}」を削除しますか？\n一時的に外すだけなら、スイッチをオフにしてください。`)) return;
      p[kind] = p[kind].filter((i) => i.id !== hit.item.id);
      p.updatedAt = nowISO();
      commit({ immediate: true });
      renderInputPane();
    }
  });

  $('#input-tabs').addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) switchTab(t.dataset.tab);
  });
}

function defaultFieldsFor(kind) {
  const p = plan();
  if (kind === 'income') return { category: cats().income[0] || '' };
  if (kind === 'savings') return { type: cats().savingsType[0] || '' };
  if (kind === 'variable') {
    const unused = cats().variable.find((v) => !p.variable.some((i) => i.category === v));
    return { category: unused || cats().variable[0] || '' };
  }
  return {};
}

function switchTab(tab) {
  if (!PLAN_KINDS.includes(tab)) return;
  state.tab = tab;
  if (state.view === 'input') history.replaceState(null, '', '#input/' + tab);
  renderInputPane();
  window.scrollTo({ top: 0 });
}

/** カテゴリを from 番目から to 番目へ移す */
function moveCategory(key, from, to) {
  const list = cats()[key];
  if (from === to || to < 0 || to >= list.length) return false;
  list.splice(to, 0, list.splice(from, 1)[0]);
  categoriesChanged();
  return true;
}

/** カテゴリ一覧のドラッグ並べ替え（指・マウス共通、Pointer Events） */
function setupCategoryDrag(root) {
  root.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if (!handle || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    const li = handle.closest('li');
    const ul = li.parentElement;
    const key = ul.closest('[data-cat]').dataset.cat;
    const rows = [...ul.children];
    const from = rows.indexOf(li);
    const rects = rows.map((el) => el.getBoundingClientRect());
    const h = rects[from].height;
    const startY = e.clientY;
    const startScroll = window.scrollY;
    let lastY = e.clientY;
    let to = from;
    let raf = 0;

    li.classList.add('dragging');
    try { handle.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }

    const layout = () => {
      // 指の動き＋スクロール量のぶんだけ、つかんだ行を動かす
      const dy = lastY - startY + (window.scrollY - startScroll);
      li.style.transform = `translateY(${dy}px)`;
      const center = rects[from].top + h / 2 + dy;
      let t = from;
      for (let i = 0; i < rows.length; i++) {
        const mid = rects[i].top + rects[i].height / 2;
        if (i < from && center < mid) { t = i; break; }
      }
      for (let i = from + 1; i < rows.length; i++) {
        const mid = rects[i].top + rects[i].height / 2;
        if (center > mid) t = i;
      }
      to = t;
      // ほかの行は、つかんだ行のぶんだけ上下にずらす（CSS の transition でなめらかに動く）
      rows.forEach((el, i) => {
        if (i === from) return;
        let shift = 0;
        if (from < to && i > from && i <= to) shift = -h;
        if (from > to && i >= to && i < from) shift = h;
        el.style.transform = shift ? `translateY(${shift}px)` : '';
      });
    };

    // 画面の端に近づいたら自動でスクロール
    const tick = () => {
      const top = 80;
      const bottom = window.innerHeight - 110;
      let v = 0;
      if (lastY < top) v = -Math.ceil((top - lastY) / 6);
      else if (lastY > bottom) v = Math.ceil((lastY - bottom) / 6);
      if (v) { window.scrollBy(0, v); layout(); }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    const onMove = (ev) => { if (ev.pointerId !== e.pointerId) return; ev.preventDefault(); lastY = ev.clientY; layout(); };
    const onEnd = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      cancelAnimationFrame(raf);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onEnd);
      window.removeEventListener('pointercancel', onEnd);
      // 落とす位置まで吸い付くように動かしてから確定
      const target = to > from ? rects[to].bottom - h - rects[from].top : rects[to].top - rects[from].top;
      li.classList.remove('dragging');
      li.classList.add('dropping');
      li.style.transform = `translateY(${target}px)`;
      setTimeout(() => {
        if (moveCategory(key, from, to)) renderSettingsKeepOpen(key);
        else { rows.forEach((el) => { el.style.transform = ''; }); li.classList.remove('dropping'); }
      }, 200);
    };
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onEnd);
    window.addEventListener('pointercancel', onEnd);
  });

  // キーボードでも並べ替えられるように（つまみにフォーカスして上下キー）
  root.addEventListener('keydown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if (!handle || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const key = handle.closest('[data-cat]').dataset.cat;
    const from = Number(handle.dataset.i);
    const to = from + (e.key === 'ArrowUp' ? -1 : 1);
    if (!moveCategory(key, from, to)) return;
    renderSettingsKeepOpen(key);
    const next = $(`#view-settings [data-cat="${key}"] .drag-handle[data-i="${to}"]`);
    if (next) next.focus();
  });
}

function setupSettingsEvents() {
  const root = $('#view-settings');
  setupCategoryDrag(root);

  root.addEventListener('submit', (e) => {
    const form = e.target.closest('[data-cat-form]');
    if (!form) return;
    e.preventDefault();
    const key = form.dataset.catForm;
    const input = form.elements.name;
    const name = input.value.trim();
    if (!name) return;
    if (cats()[key].includes(name)) { toast('同じ名前のカテゴリがあります'); return; }
    cats()[key].push(name);
    categoriesChanged();
    renderSettingsKeepOpen(key);
    const newInput = $(`[data-cat-form="${key}"] input`);
    if (newInput) newInput.focus();
  });

  root.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const catAct = btn.dataset.catAct;
    if (catAct) {
      const key = btn.closest('[data-cat]').dataset.cat;
      const list = cats()[key];
      const i = Number(btn.dataset.i);
      if (catAct === 'del') {
        if (!confirm(`カテゴリ「${list[i]}」を削除しますか？`)) return;
        list.splice(i, 1);
      } else return;
      categoriesChanged();
      renderSettingsKeepOpen(key);
      return;
    }
    switch (btn.dataset.act) {
      case 'export': exportJSON(); break;
      case 'import': $('#import-file').click(); break;
      case 'delete-month': deleteCurrentMonth(); break;
      case 'relock':
        if (!confirm('この端末のロック解除を取り消しますか？\n次に開くときにパスコードが必要になります。')) return;
        await flushSave();
        Storage.clearUnlock();
        location.reload();
        break;
      case 'reset':
        if (!confirm('すべての月の計画とカテゴリを削除して、初期状態に戻します。よろしいですか？')) return;
        if (!confirm('本当に削除しますか？元に戻せません。（先に書き出しておくことをおすすめします）')) return;
        await Storage.clear();
        state.data = createInitialData();
        ensureAnyPlan();
        setMonth(pickDefaultMonth());
        toast('初期状態に戻しました');
        break;
    }
  });

  $('#import-file').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = normalizeData(JSON.parse(String(reader.result)));
        const n = Object.keys(imported.plans).length;
        if (!confirm(`${n}か月分の計画を読み込みます。今のデータは上書きされます。よろしいですか？`)) return;
        state.data = imported;
        ensureAnyPlan();
        commit({ immediate: true });
        setMonth(pickDefaultMonth());
        toast('読み込みました');
      } catch (err) {
        console.error(err);
        alert('読み込めませんでした: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
}

function categoriesChanged() {
  state.data.categoriesUpdatedAt = nowISO();
  commit({ immediate: true });
}

function renderSettingsKeepOpen(key) {
  const open = [...document.querySelectorAll('#view-settings details[open]')].map((d) => d.dataset.cat);
  if (key && !open.includes(key)) open.push(key);
  renderSettings();
  for (const k of open) { const d = $(`#view-settings details[data-cat="${k}"]`); if (d) d.open = true; }
}

function exportJSON() {
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `okane-plan-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function deleteCurrentMonth() {
  const m = state.month;
  if (!confirm(`${monthLabel(m)} の計画を削除しますか？元に戻せません。`)) return;
  delete state.data.plans[m];
  ensureAnyPlan();
  commit({ immediate: true });
  setMonth(pickDefaultMonth());
  toast(`${monthLabel(m)} を削除しました`);
}

/* =====================================================================
 * 画面の切り替え
 * ===================================================================== */
function renderAll() {
  renderHome();
  renderInputPane();
  renderSettingsKeepOpen();
}

function applyRoute() {
  // #home / #input / #input/<収入|固定費…のキー> / #settings
  // #input/<キー>/<項目ID>（または total）なら、その項目の位置までスクロールして光らせる
  const [v, sub, itemId] = (location.hash || '#home').slice(1).split('/');
  state.view = ['home', 'input', 'settings'].includes(v) ? v : 'home';
  if (state.view === 'input' && PLAN_KINDS.includes(sub)) state.tab = sub;
  document.querySelectorAll('[data-view]').forEach((el) => el.classList.toggle('hidden', el.dataset.view !== state.view));
  document.querySelectorAll('[data-nav]').forEach((a) => {
    if (a.dataset.nav === state.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (state.view === 'home') renderHome();
  if (state.view === 'input') renderInputPane();
  window.scrollTo({ top: 0 });
  if (state.view === 'input' && itemId) revealEditTarget(decodeURIComponent(itemId));
}

function revealEditTarget(id) {
  const el = id === 'total'
    ? document.querySelector('#input-pane [data-plan-f="variableTotal"]')?.closest('.item')
    : document.querySelector(`#input-pane .item[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  requestAnimationFrame(() => {
    el.scrollIntoView({ block: 'center' });
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  });
}

/* =====================================================================
 * 起動
 * ===================================================================== */
async function startApp() {
  let raw = null;
  try {
    raw = await Storage.load();
  } catch (e) {
    console.error(e);
    alert('保存データを読み込めませんでした。初期状態で開きます。');
  }
  try {
    const loadedVersion = raw ? raw.schemaVersion : SCHEMA_VERSION;
    state.data = raw ? normalizeData(raw) : createInitialData();
    // 古い形式から変換したときは、すぐに新しい形式で保存し直す
    if (loadedVersion !== SCHEMA_VERSION) await Storage.save(state.data);
  } catch (e) {
    console.error(e);
    alert('保存データの形式が正しくありません: ' + e.message);
    state.data = createInitialData();
  }
  ensureAnyPlan();
  state.month = pickDefaultMonth();

  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#bottomnav').classList.remove('hidden');

  renderMonthSelect();
  $('#month-select').addEventListener('change', (e) => setMonth(e.target.value));
  $('#new-month-btn').addEventListener('click', openNewMonthDialog);
  setupHomeEvents();
  setupInputEvents();
  setupSettingsEvents();
  window.addEventListener('hashchange', applyRoute);
  // 画面を離れるときは保存を確定させる
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flushSave(); });
  window.addEventListener('pagehide', () => { if (saveTimer) flushSave(); });

  renderAll();
  applyRoute();
}

function showLock() {
  $('#lock').classList.remove('hidden');
  const input = $('#lock-input');
  const err = $('#lock-error');
  if (!(window.crypto && crypto.subtle)) {
    err.textContent = 'このブラウザ環境ではパスコードを確認できません。https:// のページで開いてください。';
  }
  setTimeout(() => input.focus(), 50);
  $('#lock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    try {
      const hash = await sha256Hex(input.value);
      if (hash === PASSCODE_HASH) {
        Storage.setUnlocked(PASSCODE_HASH);
        input.value = '';
        startApp();
      } else {
        err.textContent = 'パスコードが違います';
        input.select();
        const box = $('#lock .box');
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      }
    } catch (ex) {
      console.error(ex);
      err.textContent = 'パスコードを確認できませんでした。https:// のページで開いてください。';
    }
  });
}

if (Storage.isUnlocked(PASSCODE_HASH)) startApp();
else showLock();
</script>
</body>
